<!-- Reduced paid-app Beast Eidolon cards observed on AgentTesting Summoner 1,
     2026-10-29. IDs are test locators. Attack and damage have no Hit:/Damage:
     labels, and damage images have no .icon-damage-dice class. -->
<div id="eidolon-fist" class="layout-tabbed-line">
  <div style="display:flex;margin-bottom:0.8em"><div class="dice-button"><img>Roll</div><div style="flex:1"></div></div>
  <div>
    <img src="icon_prof_trained.png"><div class="weapon-name">Fist</div>
    <div class="tooltip"><img class="icon-dice" src="icon_d20.png"><div class="weapon-hit">+7<span class="tooltiptextCrit"><div class="subtitle-map">MAP -5</div><span class="mapspan">Attack 1</span>+7<br><span class="mapspan">Attack 2</span>+2<br><span class="mapspan">Attack 3</span>-3</span></div></div>
    <div class="tooltip"><img src="icon_d8.png"><span>1d8+4<sup><span class="superscript-damage">Bludgeoning</span></sup><span class="tooltiptextCrit"><div class="subtitle-map">Critical</div>2x:<div class="crit-text">1d8+4 (B)</div></span></span></div>
  </div>
  <div class="weapon-traits"><span class="trait">Disarm</span></div>
</div>
<div id="eidolon-wing" class="layout-tabbed-line">
  <div style="display:flex;margin-bottom:0.8em"><div class="dice-button"><img>Roll</div><div style="flex:1"></div></div>
  <div>
    <img src="icon_prof_trained.png"><div class="weapon-name">Wing</div>
    <div class="tooltip"><img class="icon-dice" src="icon_d20.png"><div class="weapon-hit">+7<span class="tooltiptextCrit"><div class="subtitle-map">MAP -4</div><span class="mapspan">Attack 1</span>+7<br><span class="mapspan">Attack 2</span>+3<br><span class="mapspan">Attack 3</span>-1</span></div></div>
    <div class="tooltip"><img src="icon_d6.png"><span>1d6+4<sup><span class="superscript-damage">Bludgeoning</span></sup><span class="tooltiptextCrit"><div class="subtitle-map">Critical</div>2x:<div class="crit-text">1d6+4 (B)</div></span></span></div>
  </div>
  <div class="weapon-traits"><span class="trait">Agile</span><span class="trait">Finesse</span></div>
</div>
