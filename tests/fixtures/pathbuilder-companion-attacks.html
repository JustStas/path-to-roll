<!-- Reduced paid-app Young Badger cards observed on AgentTesting Ranger 1,
     2026-10-29. Test IDs only were added. These cards are mounted inside the
     Pets .tabbed-area-display; neither .weapon-container nor the damage icon
     class .icon-damage-dice is present in the captured layout. -->
<div id="pet-jaws" class="layout-tabbed-line">
  <div style="display:flex;margin-bottom:0.8em"><div class="dice-button"><img>Roll</div><div style="flex:1"></div></div>
  <div>
    <img src="icon_prof_trained.png"><div class="weapon-name" style="margin-left:1em;width:8em">Jaws</div>
    <div class="tooltip"><img class="icon-dice"><div class="weapon-hit"><span class="weapon-span"><i>Hit:</i></span> +5<span class="tooltiptextCrit"><div class="subtitle-map">MAP -5</div><span class="mapspan">Attack 1</span>+5<br><span class="mapspan">Attack 2</span>+0<br><span class="mapspan">Attack 3</span>-5</span></div></div>
    <div class="tooltip"><img src="icon_d8.png" style="vertical-align:middle"><span><span class="weapon-span"><i>Damage:</i></span> 1d8+2<sup><span class="superscript-damage">Piercing</span></sup><span class="tooltiptextCrit"><div class="subtitle-map">Critical</div>2x:<div class="crit-text">1d8+2 (P)</div></span></span></div>
  </div>
  <div class="weapon-traits hidden"></div>
</div>
<div id="pet-claw" class="layout-tabbed-line">
  <div style="display:flex;margin-bottom:0.8em"><div class="dice-button"><img>Roll</div><div style="flex:1"></div></div>
  <div>
    <img src="icon_prof_trained.png"><div class="weapon-name" style="margin-left:1em;width:8em">Claw</div>
    <div class="tooltip"><img class="icon-dice"><div class="weapon-hit"><span class="weapon-span"><i>Hit:</i></span> +5<span class="tooltiptextCrit"><div class="subtitle-map">MAP -4</div><span class="mapspan">Attack 1</span>+5<br><span class="mapspan">Attack 2</span>+1<br><span class="mapspan">Attack 3</span>-3</span></div></div>
    <div class="tooltip"><img src="icon_d6.png" style="vertical-align:middle"><span><span class="weapon-span"><i>Damage:</i></span> 1d6+2<sup><span class="superscript-damage">Slashing</span></sup><span class="tooltiptextCrit"><div class="subtitle-map">Critical</div>2x:<div class="crit-text">1d6+2 (S)</div></span></span></div>
  </div>
  <div class="weapon-traits"><span class="trait">Agile</span></div>
</div>
